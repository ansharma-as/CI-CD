


name: Build and Deploy

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: '20'

            - name: Install dependencies
              run: npm install --legacy-peer-deps

            - name: Build the project
              run: npm run build
              
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v3
      
            - name: login to dockerhub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: build and push image
              uses: docker/build-push-action@v4
              with:
                context: .
                push: true
                file: ./Dockerfile  
                tags: strontium007/practice:latest

            - name: verify pushed image
              run: docker pull strontium007/practice:latest

            - name: Deploying to EC2 Server
              uses: appleboy/ssh-action@master
              with:
                host: ${{ secrets.SSH_HOST }}
                username: ${{ secrets.SSH_USERNNAME }}
                key: ${{ secrets.SSH_KEY }}
                script:
                    sudo docker pull strontium007/practice:latest
                    sudo docker stop practice || true
                    sudo docker rm practice || true
                    sudo docker run -d -p 80:80 --name practice strontium007/practice:latest